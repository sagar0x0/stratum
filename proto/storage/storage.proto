syntax = "proto3";

package storage;

option go_package = "github.com/sagar0x0/stratum/proto/storage";

service StorageEngine {
  rpc WriteBatch(WriteBatchRequest) returns (WriteBatchResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Scan(ScanRequest) returns (stream ScanResponse) {}
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse) {}
}

message WriteBatchRequest {
  message PutOp {
    bytes key = 1;
    bytes value = 2;
  }
  repeated PutOp puts = 1;
  repeated bytes deletes = 2;
}

message WriteBatchResponse {
  bool success = 1;
}

message GetRequest {
  bytes key = 1;
  uint64 timestamp = 2; // For MVCC snapshot reads
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  uint64 timestamp = 3;
}

message ScanResponse {
  bytes key = 1;
  bytes value = 2;
}

message SnapshotRequest {
  // Can include criteria if needed, e.g., to what extent we snapshot.
}

message SnapshotResponse {
  bytes data = 1; // Simplistic representation, typically chunked stream for real implementation
}
