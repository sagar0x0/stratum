syntax = "proto3";

package client;

option go_package = "github.com/sagar0x0/stratum/proto/client";

service ClientAPI {
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Put(PutRequest) returns (PutResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc Scan(ScanRequest) returns (stream ScanResponse) {}
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool success = 1;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
}

message ScanResponse {
  bytes key = 1;
  bytes value = 2;
}
