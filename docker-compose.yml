version: '3.8'

services:
  storage-1:
    build:
      context: .
      args:
        BINARY: storage
    command: ["-addr", ":9000", "-dir", "/data/storage"]
    volumes:
      - storage-1-data:/data/storage
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - stratum-net

  storage-2:
    build:
      context: .
      args:
        BINARY: storage
    command: ["-addr", ":9000", "-dir", "/data/storage"]
    volumes:
      - storage-2-data:/data/storage
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - stratum-net

  storage-3:
    build:
      context: .
      args:
        BINARY: storage
    command: ["-addr", ":9000", "-dir", "/data/storage"]
    volumes:
      - storage-3-data:/data/storage
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9000"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - stratum-net

  compute-1:
    build:
      context: .
      args:
        BINARY: compute
    command: ["-client-addr", ":8000", "-storage-addr", "storage-1:9000"]
    ports:
      - "8001:8000"
    depends_on:
      storage-1:
        condition: service_healthy
    networks:
      - stratum-net

  compute-2:
    build:
      context: .
      args:
        BINARY: compute
    command: ["-client-addr", ":8000", "-storage-addr", "storage-2:9000"]
    ports:
      - "8002:8000"
    depends_on:
      storage-2:
        condition: service_healthy
    networks:
      - stratum-net

  compute-3:
    build:
      context: .
      args:
        BINARY: compute
    command: ["-client-addr", ":8000", "-storage-addr", "storage-3:9000"]
    ports:
      - "8003:8000"
    depends_on:
      storage-3:
        condition: service_healthy
    networks:
      - stratum-net

volumes:
  storage-1-data:
  storage-2-data:
  storage-3-data:

networks:
  stratum-net:
    driver: bridge
